<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Home</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts instantly.</p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="create-note">
            <h2>Create a Note</h2>
            <form id="note-form">
                <div>
                    <label for="note-title">Title:</label>
                    <input type="text" id="note-title" name="title">
                </div>
                <div>
                    <label for="note-content">Content:</label>
                    <textarea id="note-content" name="content"></textarea>
                </div>
                <button type="submit">Save Note</button>
            </form>
        </section>

        <section id="notes-list">
            <h2>Your Notes</h2>
            <div class="note card">
                <h3>Welcome to QuickNotes</h3>
                <p>Start jotting down your thoughts, ideas, and daily tasks here!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
</body>

</html>
